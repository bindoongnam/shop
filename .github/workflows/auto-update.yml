name: 24h Realtime Price Auto-Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install axios

      - name: Run price crawler
        run: node update-prices.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'bindoongnam-bot'
          git config --global user.email 'bindoongnam-bot@users.noreply.github.com'
          git add products.json
          git commit -m "⚡ [자동] 실시간 최저가 및 할인율 자동 갱신 완료" || exit 0
          git push
